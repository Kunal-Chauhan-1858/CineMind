version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./cinemind.db
      # Values come from a git-ignored .env file next to this file (see .env.example)
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in a .env file next to docker-compose.yml}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
